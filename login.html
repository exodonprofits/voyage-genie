<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign In – Voyage Genie</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ocean: #0077b6;
  --ocean-deep: #023e8a;
  --teal: #00b4d8;
  --coral: #e76f51;
  --coral-dark: #c1551c;
  --off-white: #f8fafc;
  --gray-light: #f1f5f9;
  --gray-border: #e2e8f0;
  --text: #1e293b;
  --text-muted: #64748b;
  --red: #ef4444;
  --green: #10b981;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow: 0 2px 16px rgba(0,0,0,0.07);
  --transition: 0.22s cubic-bezier(0.4,0,0.2,1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--off-white);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
main { flex: 1; }

/* ── HEADER ── */
.vg-header { position: sticky; top: 0; z-index: 40; background: linear-gradient(105deg, #023e8a 0%, #0077b6 55%, #0096c7 100%); box-shadow: 0 2px 20px rgba(2,62,138,0.25); }
.vg-nav { max-width: 1240px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.vg-brand { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; }
.vg-brand img { width: 46px; height: 46px; border-radius: 10px; object-fit: contain; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); }
.vg-title { font-family: 'Playfair Display', serif; font-weight: 700; font-size: 1.4rem; color: #fff; }
.vg-right { display: flex; align-items: center; gap: 10px; }
.nav-chip { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; height: 38px; border-radius: 9px; background: rgba(255,255,255,0.14); color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,0.22); font-size: 0.88rem; font-weight: 500; transition: background var(--transition); white-space: nowrap; }
.nav-chip:hover { background: rgba(255,255,255,0.24); }
.signup-chip { display: inline-flex; align-items: center; gap: 8px; padding: 0 14px; height: 38px; border-radius: 9px; background: var(--coral); color: #fff; text-decoration: none; border: 1px solid var(--coral-dark); font-size: 0.88rem; font-weight: 600; transition: background var(--transition); white-space: nowrap; }
.signup-chip:hover { background: var(--coral-dark); }

/* ── LOGIN LAYOUT ── */
.login-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.25rem;
  background: var(--off-white);
  /* subtle background pattern */
  background-image: radial-gradient(circle at 20% 35%, rgba(0,119,182,0.06) 0%, transparent 50%),
                    radial-gradient(circle at 80% 70%, rgba(0,180,216,0.05) 0%, transparent 50%);
}

/* ── LOGIN CARD ── */
.login-card {
  width: 100%;
  max-width: 420px;
  background: #fff;
  border: 1px solid var(--gray-border);
  border-radius: var(--radius-lg);
  box-shadow: 0 8px 40px rgba(2,62,138,0.1);
  overflow: hidden;
}

.login-card-header {
  background: linear-gradient(105deg, #023e8a 0%, #0077b6 60%, #0096c7 100%);
  padding: 2rem 2rem 1.75rem;
  text-align: center;
}
.login-card-header .login-logo {
  width: 60px; height: 60px;
  border-radius: 14px;
  object-fit: contain;
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.3);
  margin: 0 auto 1rem;
  display: block;
}
.login-card-header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: #fff;
  margin-bottom: 0.3rem;
}
.login-card-header p {
  font-size: 0.88rem;
  color: rgba(255,255,255,0.75);
}

.login-card-body { padding: 1.75rem 2rem 2rem; }

/* ── FORM FIELDS ── */
.field { margin-bottom: 1.1rem; }
.field-label {
  display: block;
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 0.4rem;
}
.vg-input {
  width: 100%;
  padding: 0.7rem 1rem;
  border: 1.5px solid var(--gray-border);
  border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  color: var(--text);
  background: var(--gray-light);
  outline: none;
  transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
}
.vg-input:focus {
  border-color: var(--ocean);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(0,119,182,0.12);
}
.vg-input::placeholder { color: #94a3b8; }

/* password wrapper with show/hide toggle */
.password-wrap { position: relative; }
.password-wrap .vg-input { padding-right: 3rem; }
.password-toggle {
  position: absolute; right: 0.9rem; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; font-size: 1rem;
  color: var(--text-muted); padding: 0; line-height: 1;
  transition: color var(--transition);
}
.password-toggle:hover { color: var(--ocean); }

/* forgot link */
.forgot-link {
  display: block; text-align: right; font-size: 0.8rem;
  color: var(--ocean); text-decoration: none; margin-top: 0.35rem;
}
.forgot-link:hover { text-decoration: underline; }

/* submit button */
.btn-submit {
  width: 100%;
  padding: 0.82rem;
  background: var(--ocean);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: background var(--transition), transform var(--transition), box-shadow var(--transition);
  box-shadow: 0 4px 14px rgba(0,119,182,0.3);
  margin-top: 0.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn-submit:hover { background: var(--ocean-deep); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,119,182,0.4); }
.btn-submit:disabled { opacity: 0.65; cursor: not-allowed; transform: none; box-shadow: none; }

/* google sign-in button */
.btn-google {
  width: 100%;
  padding: 0.78rem;
  background: #fff;
  color: var(--text);
  border: 1.5px solid var(--gray-border);
  border-radius: var(--radius);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: border-color var(--transition), background var(--transition), box-shadow var(--transition);
}
.btn-google:hover:not(:disabled) {
  border-color: var(--ocean);
  background: #f8fbfe;
  box-shadow: 0 2px 12px rgba(0,119,182,0.14);
}
.btn-google:disabled { opacity: 0.65; cursor: not-allowed; }
.btn-google .google-icon { width: 18px; height: 18px; flex: 0 0 18px; }
/* spinner inside the Google button needs dark-on-white, not the white-on-ocean
   colours the submit button uses */
.btn-google .btn-spinner { border-color: rgba(0,119,182,0.25); border-top-color: var(--ocean); }
.btn-google.loading .btn-spinner { display: inline-block; }
.btn-google.loading .btn-label,
.btn-google.loading .google-icon { display: none; }

/* alerts */
.alert {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 0.7rem 0.9rem; border-radius: var(--radius);
  font-size: 0.85rem; line-height: 1.5; margin-top: 0.75rem;
  border: 1px solid; display: none;
}
.alert.show { display: flex; }
.alert-error   { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
.alert-success { background: #f0fdf4; border-color: #bbf7d0; color: #15803d; }

/* divider */
.divider { display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--gray-border); }
.divider span { font-size: 0.78rem; color: var(--text-muted); white-space: nowrap; }

/* signup link */
.signup-row {
  text-align: center;
  font-size: 0.88rem;
  color: var(--text-muted);
  margin-top: 1.25rem;
}
.signup-row a { color: var(--ocean); font-weight: 600; text-decoration: none; }
.signup-row a:hover { text-decoration: underline; }

/* back link */
.back-row {
  text-align: center;
  margin-top: 0.85rem;
}
.back-link {
  font-size: 0.82rem;
  color: var(--text-muted);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: color var(--transition);
}
.back-link:hover { color: var(--ocean); }

/* ── FOOTER ── */
footer { background: linear-gradient(105deg, #023e8a 0%, #0077b6 100%); color: rgba(255,255,255,0.85); padding: 2.5rem 1.5rem 1.5rem; }
.footer-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; }
.footer-brand { font-family: 'Playfair Display', serif; font-size: 1.1rem; font-weight: 700; color: #fff; }
.footer-links { display: flex; gap: 1.2rem; flex-wrap: wrap; }
.footer-links a { color: rgba(255,255,255,0.75); text-decoration: none; font-size: 0.88rem; }
.footer-links a:hover { color: #fff; text-decoration: underline; }
.footer-copy { max-width: 1100px; margin: 1.25rem auto 0; font-size: 0.78rem; opacity: 0.5; padding-top: 1.25rem; border-top: 1px solid rgba(255,255,255,0.12); }

/* spinner inside button */
@keyframes spin { to { transform: rotate(360deg); } }
.btn-spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.75s linear infinite; display: none; }
.btn-submit.loading .btn-spinner { display: inline-block; }
.btn-submit.loading .btn-label { display: none; }
</style>

<!-- ===== SCRIPTS ===== -->
<script>
  const vg = window.__vg_sb;

  // ── Determine where to return after login ──────────────────────
  // Use ?next= if provided; otherwise fall back to index.html
  // NEVER redirect to trip-dashboard unless explicitly requested
  function getNextTarget() {
    const p = new URLSearchParams(location.search);
    let nxt = (p.get('next') || '').trim();
    if (!nxt) return 'index.html';
    // Block absolute URLs / external redirects
    if (/^https?:\/\//i.test(nxt) || nxt.startsWith('//')) return 'index.html';
    return nxt;
  }

  const nextTarget = getNextTarget();

  // Keep register/back links aware of the next target so the round-trip works
  const signupLink = document.getElementById('signupLink');
  if (signupLink && nextTarget !== 'index.html') {
    signupLink.href = `register.html?next=${encodeURIComponent(nextTarget)}`;
  }

  // ── Show/hide password toggle ──────────────────────────────────
  const pwInput  = document.getElementById('password');
  const pwToggle = document.getElementById('pwToggle');
  pwToggle.addEventListener('click', () => {
    const show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    pwToggle.textContent = show ? '🙈' : '👁️';
    pwToggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  // ── Alert helpers ──────────────────────────────────────────────
  function showError(msg) {
    document.getElementById('alertError').classList.add('show');
    document.getElementById('alertSuccess').classList.remove('show');
    document.getElementById('errorMsg').textContent = msg;
    // The Google button sits at the top of the card while the alerts sit
    // mid-form, so on a phone a failure can render below the fold. 'nearest'
    // is a no-op when it's already visible.
    try { document.getElementById('alertError').scrollIntoView({ block: 'nearest' }); } catch (_) {}
  }
  function showSuccess(msg) {
    document.getElementById('alertSuccess').classList.add('show');
    document.getElementById('alertError').classList.remove('show');
    document.getElementById('successMsg').textContent = msg;
  }
  function clearAlerts() {
    document.getElementById('alertError').classList.remove('show');
    document.getElementById('alertSuccess').classList.remove('show');
  }

  // ── Spinner helpers ────────────────────────────────────────────
  const submitBtn = document.getElementById('submitBtn');
  function setLoading(on) {
    submitBtn.disabled = on;
    submitBtn.classList.toggle('loading', on);
  }

  // ── Surface any error from URL hash or query ───────────────────
  // Email-confirm failures arrive in the hash (#error_description=...).
  // A rejected or misconfigured OAuth round-trip comes back on the query
  // string instead (?error=access_denied&error_description=...), so check
  // both — otherwise a failed Google sign-in returns here silently and the
  // page just looks like it did nothing.
  (function () {
    const hashMatch = location.hash.match(/error_description=([^&]+)/);
    const queryErr  = new URLSearchParams(location.search).get('error_description')
                   || new URLSearchParams(location.search).get('error');
    const raw = hashMatch ? hashMatch[1] : queryErr;
    if (raw) {
      showError(decodeURIComponent(String(raw).replace(/\+/g, ' ')));
      history.replaceState(null, '', location.pathname + location.search);
    }
  })();

  // ── Make sure a user_preferences row exists ────────────────────
  // register.html creates this row, but two routes reach a working account
  // without ever running that code:
  //   1. A new Google user who clicks "Continue with Google" here rather
  //      than on the signup page.
  //   2. An email signup made while confirmation is required — signUp()
  //      returns no session there, so the insert on register.html runs
  //      unauthenticated and RLS drops it. That user's first authenticated
  //      moment is right here.
  // Create-only-if-absent, so it is safe to run on any sign-in.
  async function ensureProfile(user) {
    if (!user || !vg) return;
    try {
      const { data: existing, error: readErr } = await vg
        .from('user_preferences')
        .select('user_id')
        .eq('user_id', user.id)
        .maybeSingle();

      if (readErr) { console.warn('[login] could not check profile:', readErr.message); return; }
      if (existing) return;

      const meta = user.user_metadata || {};
      const fullName = meta.full_name || meta.name || (user.email || '').split('@')[0] || '';

      const { error: insErr } = await vg.from('user_preferences').insert({
        user_id:       user.id,
        full_name:     fullName,
        agents:        ['smarttravel'],
        categories:    ['business'],
        default_agent: 'smarttravel',
        created_via:   'voyagegenie.com'
      });
      if (insErr) console.warn('[login] profile insert failed:', insErr.message);
    } catch (e) {
      console.warn('[login] profile ensure failed:', e);
    }
  }

  // ── Auto-bounce if already signed in ──────────────────────────
  // Also the landing point for a Google round-trip: Supabase drops the
  // tokens on this URL, the SDK turns them into a session, and this sends
  // the visitor onward. The retry matters — on the OAuth return the session
  // is built from the URL during client init, so a single getUser() called
  // at the wrong moment can come back empty and strand a user who just
  // signed in successfully on the login screen.
  (async function autoBounce() {
    if (!vg?.auth) return;

    const returningFromOAuth =
      /access_token|provider_token/.test(location.hash) ||
      new URLSearchParams(location.search).has('code');

    let user = (await vg.auth.getUser()).data.user;

    if (!user && returningFromOAuth) {
      await new Promise(r => setTimeout(r, 700));
      user = (await vg.auth.getUser()).data.user;
    }

    if (user) {
      // Only worth the round-trip on an actual Google return; a plain
      // revisit already has its row.
      if (returningFromOAuth) await ensureProfile(user);
      // Strip the token fragment so it never sits in history or gets shared
      try { history.replaceState(null, '', location.pathname + location.search); } catch (_) {}
      window.location.replace(nextTarget);
    }
  })();

  // ── Google sign-in ─────────────────────────────────────────────
  const googleBtn = document.getElementById('googleBtn');
  googleBtn.addEventListener('click', async () => {
    clearAlerts();

    if (!vg?.auth) {
      showError('Sign-in service is still loading. Please wait a moment and try again.');
      return;
    }

    googleBtn.disabled = true;
    googleBtn.classList.add('loading');

    // Come back to THIS page, carrying ?next= so the visitor resumes wherever
    // they were headed. Built from location.pathname rather than a hardcoded
    // '/login.html' so it stays correct if the site ever moves into a
    // subdirectory. This exact URL must be allow-listed in Supabase.
    const redirectTo = location.origin + location.pathname +
      (nextTarget && nextTarget !== 'index.html'
        ? '?next=' + encodeURIComponent(nextTarget)
        : '');

    try {
      const { error } = await vg.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo,
          queryParams: { access_type: 'offline', prompt: 'select_account' }
        }
      });

      if (error) {
        googleBtn.disabled = false;
        googleBtn.classList.remove('loading');
        showError(error.message || 'Could not start Google sign-in. Please try again.');
        return;
      }

      // On success the browser navigates away to Google, so the button
      // intentionally stays in its loading state.
    } catch (ex) {
      googleBtn.disabled = false;
      googleBtn.classList.remove('loading');
      showError(ex?.message || 'Could not reach Google. Check your connection and try again.');
    }
  });

  // ── Form submit ────────────────────────────────────────────────
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearAlerts();

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    if (!email || !password) {
      showError('Please enter your email address and password.');
      return;
    }

    setLoading(true);
    showSuccess('Signing in…');

    const { data, error } = await vg.auth.signInWithPassword({ email, password });

    setLoading(false);

    if (error) {
      // Friendlier messages for common errors
      const msg = error.message || 'Login failed';
      if (msg.toLowerCase().includes('invalid login')) {
        showError('Incorrect email or password. Please try again.');
      } else if (msg.toLowerCase().includes('email not confirmed')) {
        showError('Please confirm your email address first. Check your inbox for a verification link.');
      } else {
        showError(msg);
      }
      return;
    }

    showSuccess('Signed in! Redirecting…');
    await ensureProfile(data?.user);
    // Small delay so user sees the success state
    setTimeout(() => { window.location.href = nextTarget; }, 600);
  });
</script>
</body>
</html>
